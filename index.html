<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Башня Упадёт — карточка персонажа с портретом А4</title>

  <style>
    :root{
      --bg:#fff;
      --card:#fff;
      --text:#320216;
      --muted:#5a0002cc;
      --accent:#5a0002;
      --accent-soft:#5a000218;
      --accent-hover:#7c1836;
      --accent-hover-soft:#7c183626;
      --hover-bg:#7c183612;
      --button:#5a0002;
      --button-text:#fff;
      --on-accent:#fff;
      --on-hover:#fff;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      padding:16px;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .app{
      max-width:1120px;
      margin:0 auto 80px;
    }

    h1,h2,h3{
      color:var(--accent);
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    h1{
      margin:0 0 8px;
      font-size:30px;
      line-height:1.1;
    }

    h2{
      margin:0;
      font-size:22px;
    }

    h3{
      margin:0;
      font-size:16px;
    }

    p{
      margin-top:0;
      color:var(--muted);
      line-height:1.45;
    }

    .card{
      margin-bottom:16px;
      padding:16px;
      border:2px solid var(--accent);
      border-radius:0;
      background:rgba(255,255,255,.94);
      box-shadow:8px 8px 0 var(--accent-soft);
      transition:background-color .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease;
    }

    .card:hover{
      box-shadow:8px 8px 0 var(--accent-hover-soft);
    }

    .title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .grid-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    label{
      display:block;
      margin-top:10px;
      margin-bottom:5px;
      font-size:14px;
      font-weight:800;
      color:var(--muted);
    }

    input,textarea,select,button{
      width:100%;
      border:1px solid var(--accent);
      border-radius:0;
      padding:10px;
      font:inherit;
      background:#fff;
      color:var(--text);
    }

    input:focus,textarea:focus,select:focus,button:focus{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }

    input:hover,textarea:hover,select:hover{
      border-color:var(--accent-hover);
      background:var(--hover-bg);
      box-shadow:inset 0 0 0 1px var(--accent-hover-soft);
    }

    textarea{
      min-height:96px;
      resize:vertical;
    }

    button{
      background:var(--button);
      color:var(--button-text);
      font-weight:900;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.04em;
      transition:background-color .14s ease,color .14s ease,border-color .14s ease,box-shadow .14s ease,filter .14s ease,transform .14s ease;
    }

    button:hover,
    button:focus-visible{
      background:var(--accent-hover);
      color:var(--on-hover);
      border-color:var(--accent-hover);
      box-shadow:5px 5px 0 var(--accent-hover-soft);
      filter:contrast(1.06);
    }

    button.secondary{
      background:#fff;
      color:var(--accent);
    }

    button.secondary:hover,
    button.secondary:focus-visible{
      background:var(--accent-hover);
      color:var(--on-hover);
      border-color:var(--accent-hover);
    }

    .hint{
      margin-top:4px;
      font-size:13px;
      color:var(--muted);
    }

    .portrait-layout{
      display:grid;
      grid-template-columns:minmax(220px,320px) 1fr;
      gap:16px;
      align-items:start;
    }

    .portrait-panel{
      padding:12px;
      border:1px solid var(--accent);
      background:rgba(255,255,255,.88);
      transition:background-color .14s ease,border-color .14s ease,box-shadow .14s ease;
    }

    .portrait-panel:hover{
      background:var(--hover-bg);
      border-color:var(--accent-hover);
      box-shadow:4px 4px 0 var(--accent-hover-soft);
    }

    .portrait-preview-wrap{
      width:100%;
      max-width:320px;
      margin-top:12px;
      border:2px solid var(--accent);
      background:#fff;
      aspect-ratio:210 / 297;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .portrait-preview-placeholder{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      color:var(--accent);
      font-weight:1000;
      text-align:center;
      text-transform:uppercase;
      letter-spacing:.05em;
      opacity:.45;
    }

    .portrait-preview{
      display:none;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      background:#fff;
    }

    .portrait-preview.has-image{
      display:block;
    }

    .portrait-preview.has-image + .portrait-preview-placeholder{
      display:none;
    }

    .portrait-actions{
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      margin-top:10px;
    }

    .export-actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:14px;
    }

    .export-preview{
      display:none;
      width:100%;
      max-width:420px;
      margin-top:14px;
      border:2px solid var(--accent);
      background:#fff;
      box-shadow:8px 8px 0 var(--accent-soft);
    }

    .export-preview.has-image{
      display:block;
    }

    @media(max-width:760px){
      body{padding:12px}
      .grid-2,
      .portrait-layout{
        grid-template-columns:1fr;
      }

      .export-actions{
        grid-template-columns:1fr;
      }

      .portrait-preview-wrap{
        max-width:100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Башня Упадёт — карточка персонажа</h1>

    <section id="characterCard" class="card">
      <div class="title-row">
        <h2>Персонаж</h2>
      </div>

      <div class="portrait-layout">
        <div class="portrait-panel">
          <h3>Портрет</h3>
          <p class="hint">Любая картинка будет показана в вертикальных пропорциях А4. Лишнее обрезается, без растягивания.</p>

          <label>Загрузить портрет</label>
          <input id="characterPortraitUpload" type="file" accept="image/*" />

          <div class="portrait-preview-wrap">
            <img id="characterPortraitPreview" class="portrait-preview" alt="Портрет персонажа" />
            <div class="portrait-preview-placeholder">Портрет<br>А4</div>
          </div>

          <div class="portrait-actions">
            <button class="secondary" type="button" onclick="removeCharacterPortrait()">Убрать портрет</button>
          </div>
        </div>

        <div>
          <div class="grid-2">
            <div>
              <label>Имя</label>
              <input id="characterName" placeholder="Имя персонажа" />
            </div>

            <div>
              <label>Класс</label>
              <select id="className">
                <option></option>
                <option>Страж Врат</option>
                <option>Светоносец</option>
                <option>Раствор Души</option>
                <option>Экономант</option>
                <option>Неболом</option>
                <option>Росоход</option>
                <option>Подкодыш</option>
                <option>Паратехник</option>
                <option>Красный Рукав</option>
              </select>
            </div>

            <div>
              <label>Народ</label>
              <select id="nationName">
                <option></option>
                <option>Народ Ножей</option>
                <option>Народ Ядов</option>
                <option>Народ Граней</option>
                <option>Народ Железа</option>
              </select>
            </div>

            <div>
              <label>Род Войск</label>
              <select id="serviceBranch">
                <option></option>
                <option>Тяжёлая пехота</option>
                <option>Мобильная пехота</option>
                <option>Разведка</option>
                <option>Военный инженер</option>
                <option>Штурмовая пехота</option>
                <option>Служба безопасности</option>
                <option>Мистическая пехота</option>
                <option>Полевой медик</option>
                <option>Отдел исследований</option>
              </select>
            </div>
          </div>

          <label>Описание</label>
          <textarea id="description" placeholder="Внешность, манеры, важные детали, странности, связи..."></textarea>

          <div class="export-actions">
            <button type="button" onclick="exportCharacterInfoCard('png')">Скачать PNG</button>
            <button class="secondary" type="button" onclick="exportCharacterInfoCard('jpeg')">Скачать JPEG</button>
            <button class="secondary" type="button" onclick="clearCharacterData()">Очистить</button>
          </div>

          <p class="hint">Экспорт создаёт отдельную карточку персонажа формата А4 с портретом и основной информацией.</p>
          <img id="exportPreview" class="export-preview" alt="Предпросмотр экспортированной карточки" />
        </div>
      </div>
    </section>
  </main>

  <script>
    const CHARACTER_DATA_KEY="towerCharacterCardDataV1";
    const CHARACTER_PORTRAIT_KEY="towerCharacterPortraitV1";

    const characterFieldIds=[
      "characterName",
      "className",
      "nationName",
      "serviceBranch",
      "description"
    ];

    let portraitDataUrl="";

    function byId(id){
      return document.getElementById(id);
    }

    function collectCharacterData(){
      const data={};
      characterFieldIds.forEach(id=>{
        const element=byId(id);
        if(element)data[id]=element.value||"";
      });
      return data;
    }

    function applyCharacterData(data){
      characterFieldIds.forEach(id=>{
        const element=byId(id);
        if(element&&data&&data[id]!==undefined)element.value=data[id];
      });
    }

    function saveCharacterData(){
      const data=collectCharacterData();

      try{
        localStorage.setItem(CHARACTER_DATA_KEY,JSON.stringify(data));
      }catch(error){
        console.error(error);
      }
    }

    function loadCharacterData(){
      const raw=localStorage.getItem(CHARACTER_DATA_KEY);
      if(!raw)return;

      try{
        applyCharacterData(JSON.parse(raw));
      }catch(error){
        console.error(error);
      }
    }

    function showPortrait(imageData){
      const preview=byId("characterPortraitPreview");

      portraitDataUrl=imageData||"";

      if(!preview)return;

      if(!portraitDataUrl){
        preview.removeAttribute("src");
        preview.classList.remove("has-image");
        return;
      }

      preview.src=portraitDataUrl;
      preview.classList.add("has-image");
    }

    function attachCharacterPortraitUpload(){
      const input=byId("characterPortraitUpload");
      if(!input)return;

      const savedImage=localStorage.getItem(CHARACTER_PORTRAIT_KEY);
      if(savedImage)showPortrait(savedImage);

      input.addEventListener("change",event=>{
        const file=event.target.files&&event.target.files[0];
        if(!file)return;

        if(!file.type.startsWith("image/")){
          alert("Можно загружать только изображения.");
          input.value="";
          return;
        }

        const reader=new FileReader();

        reader.onload=()=>{
          const imageData=String(reader.result||"");

          try{
            localStorage.setItem(CHARACTER_PORTRAIT_KEY,imageData);
          }catch(error){
            alert("Изображение слишком большое для локального сохранения браузера. Попробуй файл меньшего размера.");
            console.error(error);
          }

          showPortrait(imageData);
        };

        reader.onerror=()=>{
          alert("Не удалось прочитать файл изображения.");
        };

        reader.readAsDataURL(file);
      });
    }

    function removeCharacterPortrait(){
      const input=byId("characterPortraitUpload");
      if(input)input.value="";

      localStorage.removeItem(CHARACTER_PORTRAIT_KEY);
      showPortrait("");
      saveCharacterData();
    }

    function clearCharacterData(){
      const confirmed=confirm("Очистить основную информацию и портрет персонажа?");
      if(!confirmed)return;

      characterFieldIds.forEach(id=>{
        const element=byId(id);
        if(element)element.value="";
      });

      const input=byId("characterPortraitUpload");
      if(input)input.value="";

      localStorage.removeItem(CHARACTER_DATA_KEY);
      localStorage.removeItem(CHARACTER_PORTRAIT_KEY);

      showPortrait("");

      const exportPreview=byId("exportPreview");
      if(exportPreview){
        exportPreview.removeAttribute("src");
        exportPreview.classList.remove("has-image");
      }
    }

    function loadImage(src){
      return new Promise((resolve,reject)=>{
        if(!src){
          resolve(null);
          return;
        }

        const image=new Image();
        image.onload=()=>resolve(image);
        image.onerror=reject;
        image.src=src;
      });
    }

    function drawImageCover(ctx,image,x,y,w,h){
      if(!image)return;

      const imageRatio=image.naturalWidth/image.naturalHeight;
      const targetRatio=w/h;

      let sx=0;
      let sy=0;
      let sw=image.naturalWidth;
      let sh=image.naturalHeight;

      if(imageRatio>targetRatio){
        sw=image.naturalHeight*targetRatio;
        sx=(image.naturalWidth-sw)/2;
      }else{
        sh=image.naturalWidth/targetRatio;
        sy=(image.naturalHeight-sh)/2;
      }

      ctx.drawImage(image,sx,sy,sw,sh,x,y,w,h);
    }

    function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
      const words=String(text||"").replace(/\s+/g," ").trim().split(" ").filter(Boolean);
      const lines=[];
      let line="";

      words.forEach(word=>{
        const testLine=line?line+" "+word:word;
        if(ctx.measureText(testLine).width>maxWidth&&line){
          lines.push(line);
          line=word;
        }else{
          line=testLine;
        }
      });

      if(line)lines.push(line);

      const visibleLines=maxLines?lines.slice(0,maxLines):lines;
      visibleLines.forEach((visibleLine,index)=>{
        let output=visibleLine;

        if(maxLines&&index===maxLines-1&&lines.length>maxLines){
          while(ctx.measureText(output+"…").width>maxWidth&&output.length>0){
            output=output.slice(0,-1);
          }
          output+="…";
        }

        ctx.fillText(output,x,y+index*lineHeight);
      });

      return visibleLines.length*lineHeight;
    }

    function drawLabel(ctx,label,value,x,y,maxWidth){
      ctx.fillStyle="#5a0002cc";
      ctx.font="900 26px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillText(label.toUpperCase(),x,y);

      ctx.fillStyle="#320216";
      ctx.font="900 42px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      return wrapText(ctx,value||"—",x,y+48,maxWidth,48,2)+62;
    }

    async function exportCharacterInfoCard(format){
      saveCharacterData();

      const data=collectCharacterData();
      const image=await loadImage(portraitDataUrl);

      const canvas=document.createElement("canvas");

      // Вертикальный А4 в 150 DPI: 1240 × 1754.
      canvas.width=1240;
      canvas.height=1754;

      const ctx=canvas.getContext("2d");

      const accent="#320216";
      const muted="#5a0002cc";
      const soft="#5a000218";
      const white="#ffffff";

      ctx.fillStyle=white;
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle=soft;
      ctx.fillRect(64,64,canvas.width-128,canvas.height-128);

      ctx.fillStyle=white;
      ctx.fillRect(48,48,canvas.width-128,canvas.height-128);

      ctx.strokeStyle=accent;
      ctx.lineWidth=8;
      ctx.strokeRect(48,48,canvas.width-128,canvas.height-128);

      ctx.fillStyle=accent;
      ctx.font="1000 54px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillText("БАШНЯ УПАДЁТ",96,132);

      ctx.fillStyle=muted;
      ctx.font="900 26px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillText("КАРТОЧКА ПЕРСОНАЖА",96,174);

      const portraitX=96;
      const portraitY=230;
      const portraitW=420;
      const portraitH=594;

      ctx.fillStyle=accent;
      ctx.fillRect(portraitX-16,portraitY-16,portraitW+32,portraitH+32);

      ctx.fillStyle=white;
      ctx.fillRect(portraitX,portraitY,portraitW,portraitH);

      if(image){
        drawImageCover(ctx,image,portraitX,portraitY,portraitW,portraitH);
      }else{
        ctx.fillStyle=soft;
        ctx.fillRect(portraitX,portraitY,portraitW,portraitH);

        ctx.fillStyle=accent;
        ctx.font="1000 42px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign="center";
        ctx.fillText("ПОРТРЕТ",portraitX+portraitW/2,portraitY+portraitH/2-8);
        ctx.font="900 28px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.fillText("A4",portraitX+portraitW/2,portraitY+portraitH/2+38);
        ctx.textAlign="left";
      }

      const textX=580;
      const textY=244;
      const textW=530;

      let y=textY;

      ctx.fillStyle=accent;
      ctx.font="1000 64px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      y+=wrapText(ctx,data.characterName||"Без имени",textX,y,textW,70,3)+54;

      y+=drawLabel(ctx,"Класс",data.className,textX,y,textW);
      y+=drawLabel(ctx,"Народ",data.nationName,textX,y,textW);
      y+=drawLabel(ctx,"Род войск",data.serviceBranch,textX,y,textW);

      const descX=96;
      const descY=910;
      const descW=1048;

      ctx.fillStyle=accent;
      ctx.font="1000 36px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillText("ОПИСАНИЕ",descX,descY);

      ctx.fillStyle=accent;
      ctx.globalAlpha=.13;
      ctx.fillRect(descX,descY+24,descW,520);
      ctx.globalAlpha=1;

      ctx.fillStyle=accent;
      ctx.font="700 32px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      wrapText(ctx,data.description||"—",descX+28,descY+80,descW-56,44,10);

      ctx.strokeStyle=accent;
      ctx.lineWidth=4;
      ctx.strokeRect(descX,descY+24,descW,520);

      ctx.fillStyle=muted;
      ctx.font="900 24px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillText("ПОРТРЕТ ОБРЕЗАН ПО ПРИНЦИПУ COVER · ПРОПОРЦИИ A4",96,1614);

      const mimeType=format==="jpeg"?"image/jpeg":"image/png";
      const extension=format==="jpeg"?"jpg":"png";
      const quality=format==="jpeg"?0.92:undefined;
      const dataUrl=canvas.toDataURL(mimeType,quality);

      const exportPreview=byId("exportPreview");
      if(exportPreview){
        exportPreview.src=dataUrl;
        exportPreview.classList.add("has-image");
      }

      const safeName=(data.characterName||"character")
        .trim()
        .replace(/[\\/:*?"<>|]+/g,"")
        .replace(/\s+/g,"_")
        .slice(0,64) || "character";

      const link=document.createElement("a");
      link.href=dataUrl;
      link.download=`${safeName}_towerfall_card.${extension}`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function attachAutoSave(){
      document.addEventListener("input",event=>{
        const element=event.target;
        if(!element||element.type==="file")return;
        if(characterFieldIds.includes(element.id))saveCharacterData();
      });

      document.addEventListener("change",event=>{
        const element=event.target;
        if(!element||element.type==="file")return;
        if(characterFieldIds.includes(element.id))saveCharacterData();
      });
    }

    function init(){
      loadCharacterData();
      attachCharacterPortraitUpload();
      attachAutoSave();
    }

    try{
      init();
    }catch(error){
      console.error(error);
      const box=document.createElement("div");
      box.style.background="#5a0002";
      box.style.color="#ffffff";
      box.style.padding="16px";
      box.style.margin="16px";
      box.style.fontFamily="monospace";
      box.style.whiteSpace="pre-wrap";
      box.textContent="Ошибка JavaScript:\\n"+(error&&error.stack?error.stack:String(error));
      document.body.prepend(box);
    }
  </script>
</body>
</html>
